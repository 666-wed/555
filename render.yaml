services:
  - type: web
    name: child-guardian-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "false"
      - key: PORT
        value: 3002
      - key: DB_PATH
        value: /var/data/bridge.sqlite
      - key: ERNIE_API_KEY
        sync: false
      - key: ERNIE_MODEL
        value: ernie-speed-128k
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: onboarding@resend.dev
      - key: FRONTEND_URL
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
